name: "witness verify"
description: >-
  Runs `witness verify` against a signed session receipt bundle and
  (optionally) a changed-file tree, and publishes a content-free summary
  (counts, enums, and digests only — never a prompt, a response, a file's
  contents, or a finding's underlying evidence text) to the job's step
  summary and outputs. This is the CI merge-gate: a `fail` result means
  either the receipt itself doesn't check out (tamper, wrong key,
  missing), or the built-in policy check fired (a stop-severity finding),
  or `--against-tree` found a file the receipt never attested to.
inputs:
  bundle-path:
    description: "Path to the bundle.jsonl to verify (e.g. runs/frozen/<run_id>/bundle.jsonl)"
    required: true
  against-tree:
    description: >-
      Directory to cross-check against the receipt's attested git-tree
      coverage (Receipt v0.2's body.changed_file_digests), passed through
      to `witness verify --against-tree`. Leave empty to skip the tree
      cross-check and only verify chain/signature/policy.
    required: false
    default: ""
  python-version:
    description: "Python version to set up for `pip install -e .`"
    required: false
    default: "3.11"
  with-analyst:
    description: >-
      Pass through to `witness verify --with-analyst` — also runs the
      analyst pass and publishes its content-free report (status,
      confidence, fixed summary codes only) in the step summary. Never
      affects pass/fail: the analyst attempts a real call to Meta's
      open-weight Muse Spark Open via Baseten and falls back to the
      offline deterministic template on any failure (missing key,
      network, timeout) rather than erroring.
    required: false
    default: "false"
  baseten-api-key:
    description: >-
      Baseten API key for the live analyst call, passed through from a
      repo secret by the calling workflow (composite actions can't read
      repo secrets directly). Leave empty to use the offline template
      (no key present -> graceful fallback, not a failure).
    required: false
    default: ""
  fireworks-api-key:
    description: >-
      Fireworks API key for the live analyst call via that provider
      instead of Baseten — a second, independent host for the same
      open-weight model. Only used when analyst-provider is 'fireworks'.
    required: false
    default: ""
  analyst-provider:
    description: >-
      Which independent hosting provider --with-analyst calls: 'baseten'
      (default, confirmed live) or 'fireworks'.
    required: false
    default: "baseten"
outputs:
  result:
    description: "'pass' or 'fail'"
    value: ${{ steps.verify.outputs.result }}
  exit-code:
    description: "the raw exit code `witness verify` returned (see docs/ARCHITECTURE.md)"
    value: ${{ steps.verify.outputs.exit_code }}
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install witness
      shell: bash
      run: pip install -e "${{ github.action_path }}/../../.."

    - name: Run witness verify
      id: verify
      shell: bash
      env:
        BASETEN_API_KEY: ${{ inputs.baseten-api-key }}
        FIREWORKS_API_KEY: ${{ inputs.fireworks-api-key }}
      run: |
        set +e
        ARGS=("${{ inputs.bundle-path }}")
        if [ -n "${{ inputs.against-tree }}" ]; then
          ARGS+=(--against-tree "${{ inputs.against-tree }}")
        fi
        if [ "${{ inputs.with-analyst }}" = "true" ]; then
          ARGS+=(--with-analyst --analyst-provider "${{ inputs.analyst-provider }}")
        fi
        OUTPUT="$(witness verify "${ARGS[@]}" 2>&1)"
        EXIT_CODE=$?
        set -e

        echo "$OUTPUT"

        if [ "$EXIT_CODE" -eq 0 ]; then
          RESULT=pass
        else
          RESULT=fail
        fi
        echo "result=$RESULT" >> "$GITHUB_OUTPUT"
        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

        # Best-effort deep link into the live console: only for bundles
        # already mirrored there (console/public/bundles/, same-origin —
        # the console's CSP is connect-src 'self', so it can never fetch an
        # arbitrary PR-branch file from GitHub directly). Falls back to a
        # generic console link + drag-and-drop note for anything else,
        # rather than a link that would silently 404.
        BUNDLE_PATH="${{ inputs.bundle-path }}"
        CONSOLE_URL="https://aariasec.github.io/witness/"
        case "$BUNDLE_PATH" in
          *demo-green*) CONSOLE_LINK="${CONSOLE_URL}?bundle=bundles/demo-green.jsonl" ;;
          *demo-red*) CONSOLE_LINK="${CONSOLE_URL}?bundle=bundles/demo-red.jsonl" ;;
          *muse-real-agent-proof*) CONSOLE_LINK="${CONSOLE_URL}?bundle=bundles/muse-real-agent-proof.jsonl" ;;
          *claude-real-agent-proof*) CONSOLE_LINK="${CONSOLE_URL}?bundle=bundles/claude-real-agent-proof.jsonl" ;;
          *credential-persist-real-proof*) CONSOLE_LINK="${CONSOLE_URL}?bundle=bundles/credential-persist-real-proof.jsonl" ;;
          *) CONSOLE_LINK="" ;;
        esac

        {
          echo "### witness verify — $RESULT (exit $EXIT_CODE)"
          echo ""
          echo '```'
          echo "$OUTPUT"
          echo '```'
          echo ""
          if [ -n "$CONSOLE_LINK" ]; then
            echo "[View this receipt in the console →]($CONSOLE_LINK)"
          else
            echo "[Open the live console →]($CONSOLE_URL) — drag-and-drop \`$BUNDLE_PATH\` from this PR's branch to view it (not yet mirrored to a same-origin deep link)."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        exit "$EXIT_CODE"
