[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "witness"
version = "0.1.0"
description = "An independent recorder for AI coding-agent sessions."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "psutil>=6",
    "watchdog>=4",
    "cryptography>=42",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.5",
    "hypothesis>=6",
    "types-PyYAML>=6",
    "types-psutil>=6",
]
mcp = [
    "mcp>=2",
]

[project.scripts]
witness = "witness.cli:app"
witness-mcp-server = "witness.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=witness --cov-fail-under=70"
testpaths = ["tests"]

[tool.coverage.run]
source = ["witness"]
omit = ["src/witness/arena/*"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # BLE001-equivalent patterns aren't in our selected set, but these are
    # deliberate: typer's own documented pattern requires calling
    # typer.Option()/typer.Argument() in argument defaults.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Listeners/tailer/sim_agent intentionally catch broad exceptions and use
# preexec_fn=os.setsid — both are deliberate (never-raise parsers; the
# standard Unix new-process-group idiom used throughout the recorder).
"src/witness/tailer.py" = ["BLE001"]
"src/witness/actions/close_marker.py" = ["BLE001"]
"src/witness/cli.py" = ["BLE001", "PLW1509"]
"src/witness/demo/sim_agent.py" = ["PLW1509", "S603", "S310"]
"src/witness/ledger.py" = ["SIM115"]
"tests/*" = ["S101", "S603", "S607"]
