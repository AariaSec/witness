<!doctype html>
<html lang="en" data-simulated="unknown">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>witness · evidence console</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0d14'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23FF9F0A' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23FF9F0A'/%3E%3C/svg%3E" />
    <style>
      /*
       * The SIMULATED RECONSTRUCTION banner is hard-coded here, OUTSIDE the React
       * root, so no bundle content and no component state can remove it.
       * It is FAIL-CLOSED: visible by default (no bundle, unknown, parse failure,
       * simulated:true). It hides ONLY when a loaded manifest explicitly says
       * simulated:false (App sets <html data-simulated="false">).
       */
      #sim-banner {
        position: sticky;
        top: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        height: 30px;
        padding: 0 16px;
        font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #1a1206;
        background:
          repeating-linear-gradient(-45deg, rgba(0, 0, 0, 0.13) 0 10px, transparent 10px 20px),
          linear-gradient(90deg, #ff9f0a, #ffc24d 50%, #ff9f0a);
        border-bottom: 1px solid #c77700;
        white-space: nowrap;
        overflow: hidden;
      }
      #sim-banner .sep { opacity: 0.55; }
      #sim-banner .soft { font-weight: 500; letter-spacing: 0.12em; }
      html[data-simulated='false'] #sim-banner { display: none; }
      html, body { background: #0a0d14; margin: 0; }
    </style>
  </head>
  <body>
    <div id="sim-banner" role="note" aria-label="Simulated reconstruction disclosure">
      <span>&#9888; Simulated reconstruction</span>
      <span class="sep">&middot;</span>
      <span class="soft">our machine</span>
      <span class="sep">&middot;</span>
      <span class="soft">decoy key, decoy values only</span>
      <span class="sep">&middot;</span>
      <span class="soft">metadata only &mdash; no prompt, response or file content</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
